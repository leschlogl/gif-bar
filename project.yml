name: GIFBar

options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  GIFBarKit:
    path: GIFBarKit

targets:
  GIFBar:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: GIFBarKit
        product: Utilities
      - package: GIFBarKit
        product: Models
      - package: GIFBarKit
        product: DesignSystem
      - package: GIFBarKit
        product: Networking
      - package: GIFBarKit
        product: Persistence
      - package: GIFBarKit
        product: Services
      - package: GIFBarKit
        product: ViewModels
      - package: GIFBarKit
        product: Views
    scheme:
      testTargets:
        - GIFBarUITests
      gatherCoverageData: true

  GIFBarUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - GIFBarUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leschlogl.GIFBarUITests
        # Config/Base.xcconfig sets PRODUCT_NAME = GIFBar project-wide (applied to every
        # target via the top-level configFiles:), which otherwise makes this target's
        # module collide with the app's own GIFBar.swiftmodule at link time ("Multiple
        # commands produce ... GIFBar.swiftmodule").
        PRODUCT_NAME: $(TARGET_NAME)
    dependencies:
      - target: GIFBar
